<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro VCXC</title>
    
    <!-- Configuración PWA para celular -->
    <meta name="theme-color" content="#66001c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Registro VCXC">

    <style>
        body { 
            font-family: 'Times New Roman', Times, serif, Arial; 
            padding: 10px; 
            background-image: url('https://postimg.cc'); 
            background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; text-align: center; color: #1a1a1a; 
        }
        .card { max-width: 480px; margin: 20px auto; background: rgba(255, 255, 255, 0.98); padding: 30px; border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.7); border-top: 8px solid #66001c; box-sizing: border-box; background-image: url('https://postimg.cc'); background-size: cover; background-position: center}
        .banner-container { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; }
        .banner-img { width: 100%; max-width: 280px; height: auto; display: block; object-fit: contain; }
        .app-screen { display: none; opacity: 0; transform: translateY(10px); transition: opacity 0.3s ease, transform 0.3s ease; }
        .app-screen.active { display: block; opacity: 1; transform: translateY(0); }
        h2 { color: #66001c; margin-top: 5px; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 40px; }
        .servidor-box { color: #66001c; font-size: 25px; font-weight: bold; margin-bottom: 25px; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        .metrics-grid { display: flex; gap: 10px; margin-bottom: 20px; }
        .metric-card { flex: 1; background: #ffffff; border: 1px solid #1a1a1a; border-top: 4px solid #b4924c; padding: 12px; border-radius: 2px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .metric-val { display: block; font-size: 24px; font-weight: bold; color: #66001c; margin-top: 5px; }
        .metric-lbl { font-size: 11px; text-transform: uppercase; color: #1a1a1a; font-weight: bold; letter-spacing: 0.5px; }
        input[type="text"], select, textarea { width: 100%; padding: 12px; font-size: 15px; border-radius: 2px; border: 1px solid #1a1a1a; box-sizing: border-box; background-color: #fdfdfd; color: #333; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #1a1a1a; font-size: 14px; }
        .geo-grid { display: flex; gap: 10px; margin-top: 10px; }
        .geo-box { flex: 1; background: #fdfaf2; border: 1px solid #b4924c; padding: 10px; border-radius: 2px; font-size: 14px; font-weight: bold; text-align: center; color: #66001c; }
        .geo-label { font-size: 11px; text-transform: uppercase; color: #666; display: block; margin-bottom: 4px; }
        button { width: 100%; padding: 15px; font-size: 14px; font-weight: bold; border: 1px solid transparent; border-radius: 2px; cursor: pointer; margin-bottom: 15px; box-sizing: border-box; text-transform: uppercase; letter-spacing: 1px; }
        .btn-guinda { background-color: #66001c; color: #ffffff; border: 1px solid #66001c; }
        .btn-negro { background-color: #1a1a1a; color: #dfb15b; border: 1px solid #b4924c; }
        .btn-row-grid { display: flex; gap: 10px; width: 100%; box-sizing: border-box; }
        .btn-row-grid button { flex: 1; }
        .status-box { background: #fdfaf2; color: #66001c; padding: 14px; font-weight: bold; font-size: 14px; border-radius: 2px; margin-bottom: 20px; border: 1px solid #b4924c; border-left: 6px solid #66001c; text-align: left; }
        .error-alert { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 12px; border-radius: 2px; text-align: left; font-size: 14px; margin-top: 15px; display: none; }
        @keyframes gpsPulse { 0% { background-color: #fdfaf2; border-color: #b4924c; } 50% { background-color: #fffde6; border-color: #66001c; box-shadow: 0 0 10px 4px rgba(102,0,28,0.2); } 100% { background-color: #fdfaf2; border-color: #b4924c; } }
        .geo-loading { animation: gpsPulse 1.5s infinite ease-in-out; }
    </style>
</head>
<body>
<div class="card">
    <!-- PANTALLA 1: ACCESO -->
    <div id="screen-1" class="app-screen active">
        <div class="banner-container"><img class="banner-img" alt="Casa por casa" src="https://postimg.cc"></div>
        <h2>Acceso</h2>
        <div class="form-group" style="margin-top: 25px;">
            <label for="input-curp">Ingrese su CURP para ingresar *</label>
            <input type="text" id="input-curp" placeholder="CURP">
        </div>
        <div id="login-error" class="error-alert"></div>
        <button class="btn-guinda" onclick="validarAccesoCURP()">Ingresar</button>
    </div>

    <!-- PANTALLA 2: PANEL PRINCIPAL -->
    <div id="screen-2" class="app-screen">
        <div class="banner-container"><img class="banner-img" alt="Bienestar" src="https://postimg.cc"></div>
        <h2>¡Bienvenido!</h2>
        <div class="servidor-box">Servidor de la Nación:<br><span id="servidor-activo">-</span></div>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-lbl">Total de Visitas</span>
                <span id="metric-total" class="metric-val">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-lbl">Pendientes</span>
                <span id="metric-pendientes" class="metric-val">0</span>
            </div>
        </div>

        <div class="status-box" id="status">Paso Obligatorio: Fijar Geolocalización (GPS) antes de iniciar la captura.</div>
        <button class="btn-negro" onclick="buscarGPS()">📍 Buscar Georreferencia</button>
        
        <div class="geo-grid">
            <div class="geo-box" id="box-lat"><span class="geo-label">Latitud</span><span id="lat-txt">-</span></div>
            <div class="geo-box" id="box-lon"><span class="geo-label">Longitud</span><span id="lon-txt">-</span></div>
        </div>
        
        <div style="margin-top: 25px;">
            <button class="btn-guinda" id="btn-next-to-capture" disabled onclick="irAPantalla(3)">+ Agregar nueva visita</button>
            <button class="btn-negro" onclick="irAPantalla(4)">Ver panel de historial 📂</button>
        </div>
    </div>

    <!-- PANTALLA 3: CAPTURA DE FORMULARIO -->
    <div id="screen-3" class="app-screen">
        <h2>Captura</h2>
        <div class="status-box">Registrando nueva visita de campo</div>
        
        <div class="form-group">
            <label>3. Nombre(s) *</label>
            <input type="text" id="nombre">
        </div>
        <div class="form-group">
            <label>4. Apellido paterno *</label>
            <input type="text" id="apellido_paterno">
        </div>
        <div class="form-group">
            <label>10. Localidad *</label>
            <input type="text" id="localidad">
        </div>

        <div id="error-box" class="error-alert"></div>
        
        <div class="btn-row-grid">
            <button class="btn-guinda" onclick="guardarFormularioValidado()">💾 Guardar</button>
            <button class="btn-negro" onclick="irAPantalla(2)">⬅ Volver</button>
        </div>
    </div>

    <!-- PANTALLA 4: HISTORIAL -->
    <div id="screen-4" class="app-screen">
        <h2>Historial</h2>
        <button class="btn-guinda" onclick="descargarCSV()">📥 Descargar Visitas (.CSV)</button>
        <button class="btn-negro" onclick="irAPantalla(2)">➕ Volver al menú</button>
    </div>
</div>
<script>
    let latitudActual = ""; 
    let longitudActual = ""; 
    let nombreServidorDeducido = "";

    // Base de datos autorizada para el login en campo
    const BASE_SERVIDORES = {
        "CURP123": "JUAN PÉREZ LÓPEZ",
        "EAMM831221": "EMMANUEL MARTÍNEZ"
    };

    window.addEventListener('DOMContentLoaded', () => {
        const ultimaCurp = localStorage.getItem('ultima_curp_vcxc');
        if (ultimaCurp) document.getElementById('input-curp').value = ultimaCurp;
        actualizarContador();
    });

    function irAPantalla(screenNumber) {
        document.querySelectorAll('.app-screen').forEach(s => {
            s.classList.remove('active');
            s.style.display = 'none';
        });
        const target = document.getElementById('screen-' + screenNumber);
        if (target) {
            target.style.display = 'block';
            setTimeout(() => target.classList.add('active'), 20);
        }
        actualizarContador();
    }

    function validarAccesoCURP() {
        const curp = document.getElementById('input-curp').value.trim().toUpperCase();
        const errBox = document.getElementById('login-error');

        if (BASE_SERVIDORES[curp]) {
            nombreServidorDeducido = BASE_SERVIDORES[curp];
            document.getElementById('servidor-activo').innerText = nombreServidorDeducido;
            errBox.style.display = "none";
            localStorage.setItem('ultima_curp_vcxc', curp);
            irAPantalla(2);
        } else {
            errBox.innerText = "Acceso denegado: CURP no autorizada.";
            errBox.style.display = "block";
        }
    }

    function buscarGPS() {
        const status = document.getElementById('status');
        if (!navigator.geolocation) { status.innerText = "GPS no soportado."; return; }
        
        status.innerText = "Buscando satélites GPS...";
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                latitudActual = pos.coords.latitude;
                longitudActual = pos.coords.longitude;
                document.getElementById('lat-txt').innerText = latitudActual.toFixed(6);
                document.getElementById('lon-txt').innerText = longitudActual.toFixed(6);
                status.innerText = "Ubicación fijada con éxito.";
                document.getElementById('btn-next-to-capture').disabled = false;
            },
            (err) => { status.innerText = "Error: Active la ubicación de su celular."; },
            { enableHighAccuracy: true, timeout: 15000 }
        );
    }
    function guardarFormularioValidado() {
        const nom = document.getElementById('nombre').value.trim();
        const pat = document.getElementById('apellido_paterno').value.trim();
        const loc = document.getElementById('localidad').value.trim();

        if (!nom || !pat || !loc) {
            const eb = document.getElementById('error-box');
            eb.innerHTML = "Faltan campos obligatorios.";
            eb.style.display = "block";
            return;
        }

        const visita = { nom, pat, loc, lat: latitudActual, lon: longitudActual, fecha: new Date().toLocaleDateString() };
        let local = JSON.parse(localStorage.getItem('visitas_vcxc')) || [];
        local.push(visita);
        localStorage.setItem('visitas_vcxc', JSON.stringify(local));

        alert("¡Visita guardada en el teléfono!");
        document.getElementById('nombre').value = "";
        document.getElementById('apellido_paterno').value = "";
        document.getElementById('localidad').value = "";
        irAPantalla(2);
    }

    function actualizarContador() {
        let local = JSON.parse(localStorage.getItem('visitas_vcxc')) || [];
        if(document.getElementById('metric-total')) document.getElementById('metric-total').innerText = local.length;
    }

    function descargarCSV() {
        let local = JSON.parse(localStorage.getItem('visitas_vcxc')) || [];
        if(local.length === 0) { alert("No hay datos que descargar."); return; }
        let csv = "Nombre,Apellido,Localidad,Latitud,Longitud,Fecha\n";
        local.forEach(v => { csv += `"${v.nom}","${v.pat}","${v.loc}","${v.lat}","${v.lon}","${v.fecha}"\n`; });
        let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "visitas_campo.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
