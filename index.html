<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro VCXC</title>
    
    <!-- Vinculación PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#66001c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Registro VCXC">
    
    <!-- Vinculación del archivo CSS externo -->
    <link rel="stylesheet" href="css/styles.css">
</head>
  
<body>

<div class="card">
    <!-- PANTALLA 1: ACCESO -->
    <div id="screen-1" class="app-screen active">
        <div class="banner-container"><img class="banner-img" alt="Casa por casa" src="https://i.postimg.cc/d0vkfb03/SIN-FONDO.png"></div>
        <h2>Acceso</h2>
        <div class="form-group" style="margin-top: 25px;">
            <label for="input-curp">Ingrese su CURP para ingresar *</label>
            <input type="text" id="input-curp" placeholder="CURP">
        </div>
        <!-- Aquí continúa el resto de tus pantallas del formulario... -->
         <!-- PANTALLA 2: PANEL DE CONTROL -->
    <div id="screen-2" class="app-screen">
        <img class="banner-img-wide" alt="Bienestar" src="https://pub.bienestar.gob.mx/static/media/padrones01.e4252fd6.jpg">
        <h2>¡Bienvenido!</h2>
        <div class="subtitle">SERVIDOR DE LA NACION</div>
        <div class="form-group">
            <div id="servidor-activo" class="servidor-box">-</div>
        </div>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-lbl">Total de Visitas guardadas</span>
                <span id="metric-total" class="metric-val">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-lbl">Pendientes de sincronizar</span>
                <span id="metric-pendientes" class="metric-val">0</span>
            </div>
        </div>

        <div class="form-group">
            <label>Paso Obligatorio: Fijar Geolocalización (GPS) *</label>
            <button type="button" class="btn-guinda" onclick="buscarGPS()">📍 Buscar Georreferencia</button>
            <div class="geo-grid">
                <!-- Verifica que tus casillas tengan estos IDs exactos en el HTML -->
                <div id="box-lat" class="geo-box"><span class="geo-label">Latitud</span><span id="lat-txt">-</span></div>
                <div id="box-lon" class="geo-box"><span class="geo-label">Longitud</span><span id="lon-txt">-</span></div>
            </div>
        </div>
        
        <button type="button" id="btn-next-to-capture" class="btn-guinda" style="margin-top: 10px;" onclick="irAPantalla(3)" disabled>+ Agregar nueva visita</button>
        <button type="button" class="btn-negro" onclick="irAPantalla(4)">Ver panel de historial 📂</button>
    </div>
    <!-- PANTALLA 3: PREGUNTAS EN CAMPO -->
    <div id="screen-3" class="app-screen">
        <img class="banner-img-wide" alt="Bienestar" src="https://pub.bienestar.gob.mx/static/media/padrones01.e4252fd6.jpg">
        <div class="servidor-box">Captura de visita.</div>
        
        <h3>Datos de la Persona Entrevistada</h3>
        <div class="form-group"><label for="nombre">3. Nombre(s) *</label><input type="text" id="nombre"></div>
        <div class="form-group"><label for="apellido_paterno">4. Apellido paterno *</label><input type="text" id="apellido_paterno"></div>
        <div class="form-group"><label for="apellido_materno">5. Apellido materno</label><input type="text" id="apellido_materno"></div>
        <div class="form-group"><label for="telefono">6. Teléfono</label><input type="tel" id="telefono" pattern="[0-9]{10}" placeholder="10 dígitos numéricos"></div>
        
        <div class="form-group">
            <label>7. Sexo *</label>
            <div class="radio-tile-group">
                <label class="radio-tile"><input type="radio" name="sexo" value="Hombre"><span>Hombre</span></label>
                <label class="radio-tile"><input type="radio" name="sexo" value="Mujer"><span>Mujer</span></label>
            </div>
        </div>
        
        <div class="form-group">
            <label>8. Grupo de edad *</label>
            <div class="radio-tile-group vertical">
                <label class="radio-tile"><input type="radio" name="grupo_edad" value="Joven de 15 a 29 años"><span>Joven de 15 a 29 años</span></label>
                <label class="radio-tile"><input type="radio" name="grupo_edad" value="Adulto de 30 a 64 años"><span>Adulto de 30 a 64 años</span></label>
                <label class="radio-tile"><input type="radio" name="grupo_edad" value="Adulto Mayor de 65 años"><span>Adulto Mayor de 65 años</span></label>
            </div>
        </div>
        <h3>Domicilio</h3>
        <div class="form-group">
            <label for="domicilio">9. Calle, Número, Colonia</label>
            <textarea id="domicilio" rows="3" placeholder="Dirección detallada..."></textarea>
        </div>
        <div class="form-group"><label for="localidad">10. Localidad *</label><input type="text" id="localidad"></div>
        <div class="form-group"><label for="zona">11. Zona *</label><input type="number" id="zona" pattern="[0-9]*" placeholder="Solo números"></div>
        <div class="form-group"><label for="seccion">12. Sección *</label><input type="number" id="seccion" pattern="[0-9]*" placeholder="Solo números"></div>
        
        <h3>Información Complementaria</h3>
        <div class="form-group">
            <label for="programa">13. Programa al que pertenece</label>
            <select id="programa">
                <option value="">Selecciona una opción...</option>
                <option value="Adulto Mayor">Adulto Mayor</option>
                <option value="Discapacidad">Discapacidad</option>
                <option value="Mujeres Bienestar">Mujeres Bienestar</option>
                <option value="Beca Benito Juarez">Beca Benito Juarez</option>
                <option value="Beca Rita Cetina">Beca Rita Cetina</option>
                <option value="Jovenes Construyendo el Futuro">Jovenes Construyendo el Futuro</option>
                <option value="Boxeando por la Paz">Boxeando por la Paz</option>
                <option value="Ninguno">Ninguno</option>
                <option value="Otro">Otro</option>
            </select>
        </div>
        <div class="form-group">
            <label for="recepcion">14. ¿Cómo califica la recepción del mensaje? *</label>
            <select id="recepcion">
                <option value="">Selecciona una opción...</option>
                <option value="Excelente">Excelente</option>
                <option value="Bueno">Bueno</option>
                <option value="Regular">Regular</option>
                <option value="Mala">Mala</option>
                <option value="Muy mala">Muy mala</option>
            </select>
        </div>
        <div class="form-group">
            <label for="problematica">15. Problemática detectada</label>
            <select id="problematica">
                <option value="">Selecciona una opción...</option>
                <option value="AGUA">AGUA</option>
                <option value="ELECTRICIDAD">ELECTRICIDAD</option>
                <option value="VIVIENDA">VIVIENDA</option>
                <option value="SALUD">SALUD</option>
                <option value="EDUCACION">EDUCACION</option>
                <option value="TRANSPORTE">TRANSPORTE</option>
                <option value="SERVICIOS PUBLICOS">SERVICIOS PUBLICOS</option>
                <option value="MEDIO AMBIENTE">MEDIO AMBIENTE</option>
                <option value="PROGRAMAS SOCIALES">PROGRAMAS SOCIALES</option>
                <option value="TRAMITES">TRAMITES</option>
                <option value="OTRO">OTRO</option>
            </select>
        </div>
        <div class="form-group"><label for="observacion">16. Observaciones e incidencias</label><textarea id="observacion" rows="3" placeholder="Anotaciones de campo..."></textarea></div>
        
        <button type="button" class="btn-guinda" onclick="guardarFormularioValidado()">💾 Guardar visita</button>
        <div id="error-box" class="error-alert"></div>
        <button type="button" class="btn-negro" onclick="irAPantalla(2)">⬅️ Cancelar y Volver</button>
    </div>

    <!-- PANTALLA 4: HISTORIAL Y AUDITORÍA -->
    <div id="screen-4" class="app-screen">
        <img class="banner-img-wide" alt="Bienestar" src="https://pub.bienestar.gob.mx/static/media/padrones01.e4252fd6.jpg">
        <h2>Historial</h2>
             
        <div id="contador" class="status-box">📂 Visitas pendientes por sincronizar: 0</div>
        
        <button type="button" class="btn-guinda" onclick="sincronizarGSheets()">🔄 Sincronizar visitas</button>
          <div id="status" style="margin: 15px; font-weight: bold; color: #1a1a1a; font-size: 14px;"></div>
        
<!-- Reemplaza tus dos botones viejos en la pantalla 4 por esta estructura unificada -->
<div class="btn-row-grid">
    <button type="button" class="btn-negro" onclick="descargarReporteCSV()">📥 DESCARGAR VISITAS (.CSV)</button>
    <button type="button" class="btn-guinda" style="background-color: #4a0014; border-color: #4a0014; margin-bottom: 15px;" onclick="eliminarHistorialLocal()">⚠️ VACIAR MEMORIA DEL TELEFONO</button>
</div>

            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>PERSONA ENTREVISTADA</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="historial-body">

                </tbody>
            </table>
        </div>
        
        <button type="button" class="btn-guinda" style="margin-top: 15px;" onclick="irAPantalla(2)">➕ Agregar Nueva Visita</button>
    </div>
    
</div>
